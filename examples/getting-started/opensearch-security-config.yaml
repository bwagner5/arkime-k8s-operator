# Security configuration for the pinned OpenSearch operator 2.8.0 / OpenSearch 3.3.2.
# Trimmed from the operator's securityconfig-secret.yaml example: Dashboards is
# disabled here, so its demo user and roles are gone.
# ADMIN_PASSWORD_HASH is replaced with a bcrypt hash before this is applied.
apiVersion: v1
kind: Secret
metadata:
  name: opensearch-security-config
  namespace: arkime
type: Opaque
stringData:
  action_groups.yml: |-
    _meta:
      type: "actiongroups"
      config_version: 2
  internal_users.yml: |-
    _meta:
      type: "internalusers"
      config_version: 2
    admin:
      hash: "ADMIN_PASSWORD_HASH"
      reserved: true
      backend_roles:
      - "admin"
  nodes_dn.yml: |-
    _meta:
      type: "nodesdn"
      config_version: 2
  whitelist.yml: |-
    _meta:
      type: "whitelist"
      config_version: 2
  tenants.yml: |-
    _meta:
      type: "tenants"
      config_version: 2
  roles.yml: |-
    _meta:
      type: "roles"
      config_version: 2
  roles_mapping.yml: |-
    _meta:
      type: "rolesmapping"
      config_version: 2
    all_access:
      reserved: false
      backend_roles:
      - "admin"
  config.yml: |-
    _meta:
      type: "config"
      config_version: "2"
    config:
      dynamic:
        http:
          anonymous_auth_enabled: false
        authc:
          basic_internal_auth_domain:
            http_enabled: true
            transport_enabled: true
            order: "4"
            http_authenticator:
              type: basic
              challenge: true
            authentication_backend:
              type: intern
