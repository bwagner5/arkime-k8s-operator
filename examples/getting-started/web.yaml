apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: arkime-web
  namespace: arkime
spec:
  secretName: arkime-web-tls
  dnsNames: [arkime.home.arpa]
  duration: 2160h
  renewBefore: 360h
  privateKey:
    rotationPolicy: Always
  issuerRef:
    name: arkime-ca
    kind: Issuer
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: arkime-web
  namespace: arkime
spec:
  gatewayClassName: traefik
  listeners:
    - name: https
      hostname: arkime.home.arpa
      port: 8443 # Must match Traefik's container entrypoint; Service exposes 443.
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: arkime-web-tls
      allowedRoutes:
        namespaces:
          from: Same
