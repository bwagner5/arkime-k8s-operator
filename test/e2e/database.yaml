apiVersion: v1
kind: Service
metadata:
  name: opensearch
spec:
  selector: {app: opensearch}
  ports:
    - {port: 9200, targetPort: 9200}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch
spec:
  replicas: 1
  selector:
    matchLabels: {app: opensearch}
  template:
    metadata:
      labels: {app: opensearch}
    spec:
      containers:
        - name: opensearch
          image: opensearchproject/opensearch@sha256:798cf28e226a32f5c928dd1ed9478dd3a33d2212176aad3679020088ad3afa1a
          env:
            - {name: discovery.type, value: single-node}
            - {name: DISABLE_SECURITY_PLUGIN, value: 'true'}
            - {name: DISABLE_INSTALL_DEMO_CONFIG, value: 'true'}
            - {name: OPENSEARCH_JAVA_OPTS, value: '-Xms512m -Xmx512m'}
            - {name: node.store.allow_mmap, value: 'false'}
          resources:
            requests: {cpu: 250m, memory: 1Gi}
          ports:
            - {containerPort: 9200}
          readinessProbe:
            httpGet: {path: /_cluster/health, port: 9200}
            initialDelaySeconds: 20
            periodSeconds: 5
