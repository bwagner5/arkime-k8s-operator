name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v4.2.0
      - uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6.3.0
        with:
          install-only: true
          version: v2.14.1
      - run: make ci-verify
      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - run: make release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify published artifacts
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools inspect "ghcr.io/bwagner5/arkime-k8s-operator:$version"
          docker buildx imagetools inspect "ghcr.io/bwagner5/arkime-pod-enricher:$version"
          helm show chart oci://ghcr.io/bwagner5/arkime-k8s-operator/helm-charts/arkime-k8s-operator --version "$version"
          helm show chart oci://ghcr.io/bwagner5/arkime-k8s-operator/helm-charts/arkime-k8s-operator-crds --version "$version"
      # GoReleaser drafts the release so a failed verification above leaves nothing public;
      # publishing is what attaches it to the tag.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
